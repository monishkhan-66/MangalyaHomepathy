{% extends "base.html" %}
{% block content2 %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm p-4 rounded-4">
        <h4 class="text-center mb-2">My Appointments</h4>
        <p class="text-muted text-center">
          Enter your email view your appointments
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <input
              type="text"
              name="value"
              class="form-control form-control-lg text-center"
              placeholder="Email"
              required
            >
          </div>

          <button class="btn btn-primary w-100 rounded-pill">
            Send OTP
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
