{% extends "base.html" %}
{% block content2 %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm p-4 rounded-4 text-center">

        <h4 class="mb-2">Verify OTP</h4>
        <p class="text-muted">
          Enter the 6-digit OTP sent to you
        </p>

        <form method="post">
          {% csrf_token %}

          <input
            type="text"
            name="otp"
            maxlength="6"
            class="form-control form-control-lg text-center mb-3"
            placeholder="Enter OTP"
            required
          >

          {% if error %}
            <div class="alert alert-danger py-1">
              Invalid OTP. Please try again.
            </div>
          {% endif %}

          <button class="btn btn-success w-100 rounded-pill">
            Verify & View Appointments
          </button>
        </form>

        <a href="{% url 'my_appointments' %}" class="d-block mt-3 text-decoration-none">
          Change email
        </a>
      </div>
    </div>
  </div>
</div>

{% endblock %}
