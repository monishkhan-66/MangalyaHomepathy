<!DOCTYPE html>
<html>

<head>

    <title>
        Patient Cards
    </title>

</head>

<body>

    <h1>
        Patient Profiles
    </h1>

    {% for patient in patients %}

        <div style="
            border:1px solid #ccc;
            padding:20px;
            margin:10px;
            border-radius:10px;
        ">

            <h2>
                {{ patient.first_name }}
                {{ patient.last_name }}
            </h2>

            <p>
                Patient ID:
                {{ patient.patient_id }}
            </p>

            <p>
                Gender:
                {{ patient.gender }}
            </p>

            <p>
                DOB:
                {{ patient.dob }}
            </p>

            <button>

                Book Appointment

            </button>

        </div>

    {% empty %}

        <h3>
            No Patient Found
        </h3>

        <button>

            Add New Patient

        </button>

    {% endfor %}

</body>

</html>
